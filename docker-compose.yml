# O EDM·KT em dois serviços, a api FastAPI e o web com o dev server do Vite
# A GPU NVIDIA é opcional e entra pelo docker-compose.gpu.yml, ligado pelo COMPOSE_FILE do .env
services:
  # A api não publica porta, e o navegador só a alcança pelo proxy same-origin do Vite
  api:
    # O estágio app do Dockerfile, que deriva do core, e o compose constrói os dois
    build:
      context: .
      target: app
    image: edmkt-app:dev
    # Sem rótulo do SELinux, para o container ler o bind mount do repositório em hosts que o usam
    security_opt:
      - label=disable
    volumes:
      - ./:/app
    environment:
      # O código vem do bind mount em /app, e src/ no path torna importáveis o ml/ e o api/
      PYTHONPATH: /app/src
      # O CLI roda fora do repositório, para o CLAUDE.md do projeto não entrar em cada chamada
      EDMKT_KC_CWD: /tmp
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # A credencial do CLI do Claude vem do .env e só a api a recebe, e sem ela só a geração de KCs falha
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
    # O 0.0.0.0 é de dentro do container, e um worker só, porque o SQLite tem escritor único e a GPU é uma
    command:
      - uvicorn
      - api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8099"
      - --workers
      - "1"

  # O dev server do Vite, que serve a SPA, e o docker compose run deste serviço roda os testes do front
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: edmkt-web:dev
    working_dir: /app/src/web
    depends_on:
      - api
    # O node_modules vem da imagem por um volume nomeado e nunca é gravado no repositório
    volumes:
      - ./:/app
      - edmkt_web_node_modules:/app/src/web/node_modules
    security_opt:
      - label=disable
    environment:
      # O Vite recusa um Host desconhecido, e outros nomes além do localhost entram pelo .env
      VITE_ALLOWED_HOSTS: ${EDMKT_ALLOWED_HOSTS:-}
    # A porta sai sempre com IP explícito, e o padrão 127.0.0.1 deixa o app só nesta máquina
    ports:
      - "${EDMKT_BIND_IP:-127.0.0.1}:5173:5173"
    command: ["npm", "run", "dev", "--", "--host"]

volumes:
  edmkt_web_node_modules:
