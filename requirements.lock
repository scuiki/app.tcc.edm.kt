# Pins do EDM·KT validados pelo teste de regressão (tests/test_regression_a439.py).

# São as versões exatas da imagem `edmkt-core:dev` quando as dez seeds do A439 deram a média 0,7278.

# Essa média do first-attempt AUC tem de ficar na faixa de ±0,1 ponto, de 0,7268 a 0,7288.

# O teste pega mudança no código ou nas versões, e não compara com o TCC 1 nem com o paper.

# Versão que tire a média da faixa deixa o teste vermelho, e o pin só muda com ele verde de novo.
#
# REPRODUCIBILITY ANCHOR — the real freeze is the Docker image, not this file:
#   torch and numpy ship from the conda env of the pinned base image
#   (pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime, see Dockerfile) and are NOT pip-installable
#   from PyPI as plain `torch==2.7.1+cu128`. To reproduce the numerics, build from that exact
#   image tag; this lockfile records the resolved versions that tag yields so any drift shows.
#
# Validated environment (captured from `docker run edmkt-core:dev python -m pip freeze`,
# regression test green on the nitro RTX 4050 / CUDA 12.8 GPU):
#   Python  3.11.13
#   CUDA    12.8 (torch.version.cuda)
#   PYTHONHASHSEED  0 (ENV do Dockerfile, e a ordem dos AST paths depende dele)

