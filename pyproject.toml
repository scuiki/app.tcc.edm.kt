[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmkt"
version = "0.1.0"
description = "EDM·KT: ml/ (Code-DKT knowledge tracing over ProgSnap2) and api/ (the teacher-facing FastAPI app). TCC 2 deployment of TCC 1 research."
requires-python = ">=3.10,<3.13"

# Dependências de execução herdadas do ambiente do TCC 1 (commit 0e8807c).

# As versões exatas ficam no requirements.lock, e o teste de regressão é quem as valida.

# A média das dez seeds do A439 na primeira tentativa tem de ficar em ±0,1 ponto de 0,7278.

# O torch e o numpy vêm do conda da imagem base e ficam sem versão aqui, porque a âncora é a imagem.

# O torch==2.7.1+cu128 não é um pin comum do PyPI, e os pins abaixo só sobem com a regressão verde.
dependencies = [
    "torch",            # base image conda env: torch==2.7.1+cu128 (sm_89, RTX 4050)
    "numpy",            # base image conda env: numpy==2.2.6
    "pandas==2.3.3",
    "javalang==0.13.0",
    "anytree==2.13.0",
    "scikit-learn==1.9.0",
    # Os vetores do KCGen-KT (SBERT dos nomes e CodeBERT das soluções), fora da numérica do Code-DKT
    # Nas versões da imagem de 01/10/2026, para os vetores não mudarem quando a imagem for refeita
    "sentence-transformers==5.4.1",
    "transformers==5.18.0",
    "tokenizers==0.23.2",
    "huggingface_hub==1.33.0",
    "safetensors==0.8.0",
    # HTTP/I/O stack (waves 2-3): camada de transporte, NÃO toca o resultado numérico do treino,
    # e a tolerância de ±0,1 ponto segue ancorada na tag fixa da imagem torch, não nestes pins.
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # transport do fastapi.testclient.TestClient
    "import-linter==2.15",  # verifica a regra de dependência de docs/ARCHITECTURE.md
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Testes ficam ao lado do arquivo testado (<arquivo>_test.py, docs/ARCHITECTURE.md); tests/ guarda
# só os testes de regressão, a comparação com o paper, as fixtures e os dados de exemplo.
testpaths = ["src", "tests"]
python_files = ["*_test.py", "test_*.py"]
pythonpath = ["src", "."]  # "." para tests.fixtures (ver tests/fixtures/__init__.py)
markers = [
    "regression: dez seeds do Code-DKT no A439, com a média do first-attempt AUC em ±0,1 ponto de 0,7278, na GPU com o CSEDM real, precisa do EDMKT_CSEDM_PATH e roda com -m regression; marca também os testes do KCGen-KT que carregam os modelos de vetores ou a extração de referência",
    "literature: comparação com as Tabelas 1 e 2 de Shi et al. (2022), cinco exercícios e dez seeds na GPU com o CSEDM real, roda com -m literature -s e grava docs/results/code_dkt_literature_comparison.json",
]
# importlib: dois *_test.py com o mesmo nome em pastas diferentes não colidem.
addopts = "-m 'not regression and not literature' --import-mode=importlib"

# A regra de dependência de docs/ARCHITECTURE.md, verificada: `lint-imports` (no container).
[tool.importlinter]
root_packages = ["api", "ml"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ml/ é uma biblioteca: não conhece a aplicação"
type = "forbidden"
source_modules = ["ml"]
forbidden_modules = ["api", "fastapi", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Camadas de cada funcionalidade: presentation > infrastructure > application > domain"
type = "layers"
containers = [
    "api.shared",
    "api.assignments",
    "api.assignments.problems",
    "api.classrooms",
    "api.classroom_import",
    "api.knowledge_components",
    "api.model_training",
    "api.mastery_dashboard",
]
layers = ["presentation", "infrastructure", "application", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "O domínio não depende de framework, banco, disco nem do ml/"
type = "forbidden"
source_modules = ["api.*.domain", "api.assignments.problems.domain"]
forbidden_modules = [
    "api.*.application",
    "api.*.infrastructure",
    "api.*.presentation",
    "api.assignments.problems.application",
    "api.assignments.problems.infrastructure",
    "api.assignments.problems.presentation",
    "fastapi",
    "sqlite3",
    "torch",
    "ml",
]

[[tool.importlinter.contracts]]
name = "A aplicação só enxerga as interfaces do domínio"
type = "forbidden"
source_modules = ["api.*.application", "api.assignments.problems.application"]
forbidden_modules = ["api.*.infrastructure", "api.*.presentation", "api.assignments.problems.infrastructure", "api.assignments.problems.presentation", "fastapi", "sqlite3", "torch", "ml"]

[[tool.importlinter.contracts]]
name = "assignments: de outra funcionalidade, só o domain/ (a presentation/ monta tudo e fica de fora)"
