[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmkt_core"
version = "0.1.0"
description = "EDM·KT scientific core: Code-DKT knowledge tracing over ProgSnap2 (TCC 2 deployment of TCC 1 research)."
requires-python = ">=3.10,<3.13"

# Runtime deps inherited from the TCC 1 environment (commit 0e8807c).
# Exact versions are frozen in requirements.lock — validated by the golden-run as the
# version oracle (CORE-03/RESEARCH A2): A439 first-attempt AUC = 0.7608, in band
# [0.7027, 0.7627]. torch/numpy come from the pinned base image conda env (see Dockerfile,
# pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime); they are listed unversioned here because
# the image — not PyPI — is the reproducibility anchor (torch==2.7.1+cu128 is not a plain
# PyPI pin). The lower bounds below match the resolved lock; bump only with a green golden-run.
dependencies = [
    "torch",            # base image conda env: torch==2.7.1+cu128 (sm_89, RTX 4050)
    "numpy",            # base image conda env: numpy==2.2.6
    "pandas==2.3.3",
    "javalang==0.13.0",
    "anytree==2.13.0",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: fidelity golden-run, needs EDMKT_CSEDM_PATH (deselect with -m 'not golden')",
]
addopts = "-m 'not golden'"
