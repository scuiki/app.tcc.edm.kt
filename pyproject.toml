[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmkt_core"
version = "0.1.0"
description = "EDM·KT scientific core: Code-DKT knowledge tracing over ProgSnap2 (TCC 2 deployment of TCC 1 research)."
requires-python = ">=3.10,<3.13"

# Runtime deps inherited from the TCC 1 environment (commit 0e8807c).
# torch/numpy are intentionally NOT pinned here: the exact line that trained the
# TCC 1 numbers is not frozen anywhere in TCC 1 (no lockfile). The golden-run
# (plan 06) is the version oracle — any line keeping A439 first-attempt AUC in
# [70.27, 76.27] is acceptable.
# TODO(plan 06): pin torch/numpy to the resolved lockfile line + Docker image tag.
dependencies = [
    "torch",            # TODO(plan 06): pin to TCC 1 line (cu12x; nitro RTX 4050 = sm_89)
    "numpy",            # TODO(plan 06): pin to TCC 1 line (<2.0 or 2.x — confirm vs numerics)
    "pandas>=2,<3",
    "javalang==0.13.0",
    "anytree>=2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: fidelity golden-run, needs EDMKT_CSEDM_PATH (deselect with -m 'not golden')",
]
addopts = "-m 'not golden'"
