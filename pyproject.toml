[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmkt"
version = "0.1.0"
description = "EDM·KT: ml/ (Code-DKT knowledge tracing over ProgSnap2) and api/ (the teacher-facing FastAPI app). TCC 2 deployment of TCC 1 research."
requires-python = ">=3.10,<3.13"

# Runtime deps inherited from the TCC 1 environment (commit 0e8807c).
# Exact versions are frozen in requirements.lock — validated by the regression test as the
# version oracle (CORE-03/RESEARCH A2): A439 first-attempt AUC = 0.7608, in band
# [0.7027, 0.7627]. torch/numpy come from the pinned base image conda env (see Dockerfile,
# pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime); they are listed unversioned here because
# the image — not PyPI — is the reproducibility anchor (torch==2.7.1+cu128 is not a plain
# PyPI pin). The lower bounds below match the resolved lock; bump only with a green regression test.
dependencies = [
    "torch",            # base image conda env: torch==2.7.1+cu128 (sm_89, RTX 4050)
    "numpy",            # base image conda env: numpy==2.2.6
    "pandas==2.3.3",
    "javalang==0.13.0",
    "anytree==2.13.0",
    "scikit-learn==1.9.0",
    # SBERT (KCGen-KT Etapa 3): única dependência nova da Fase 5. Pin = versão do TCC 1
    # (notebook de pesquisa: s-transformers = 5.4.1), não a latest — fidelidade do silhouette/
    # embeddings com results/kc_clusters_A*.json (Open Q1, KC-01). Transporte/embeddings, NÃO
    # toca a numérica de treino do Code-DKT (não afeta a banda ±3pp do teste de regressão).
    "sentence-transformers==5.4.1",
    # HTTP/I/O stack (waves 2-3): camada de transporte, NÃO toca a numérica de treino —
    # a banda ±3pp segue ancorada na tag fixa da imagem torch, não nestes pins.
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # transport do fastapi.testclient.TestClient
    "import-linter==2.15",  # verifica a regra de dependência de docs/ARCHITECTURE.md
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Testes ficam ao lado do arquivo testado (<arquivo>_test.py, docs/ARCHITECTURE.md); tests/ guarda
# só o teste de regressão contra o TCC 1 e os dados de exemplo.
testpaths = ["src", "tests"]
python_files = ["*_test.py", "test_*.py"]
pythonpath = ["src", "."]  # "." para tests.fixtures (ver tests/fixtures/__init__.py)
markers = [
    "regression: AUC regression test against the TCC 1 reference run (A439, GPU + real CSEDM), needs EDMKT_CSEDM_PATH (deselect with -m 'not regression')",
]
# importlib: dois *_test.py com o mesmo nome em pastas diferentes não colidem.
addopts = "-m 'not regression' --import-mode=importlib"

# A regra de dependência de docs/ARCHITECTURE.md, verificada: `lint-imports` (no container).
[tool.importlinter]
root_packages = ["api", "ml"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ml/ é uma biblioteca: não conhece a aplicação"
type = "forbidden"
source_modules = ["ml"]
forbidden_modules = ["api", "fastapi", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Camadas de cada funcionalidade: presentation > infrastructure > application > domain"
type = "layers"
containers = [
    "api.shared",
    "api.assignments",
    "api.classrooms",
    "api.classroom_import",
    "api.knowledge_components",
    "api.model_training",
    "api.mastery_dashboard",
]
layers = ["presentation", "infrastructure", "application", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "O domínio não depende de framework, banco, disco nem do ml/"
type = "forbidden"
source_modules = ["api.*.domain"]
forbidden_modules = [
    "api.*.application",
    "api.*.infrastructure",
    "api.*.presentation",
    "fastapi",
    "sqlite3",
    "torch",
    "ml",
]

[[tool.importlinter.contracts]]
name = "A aplicação só enxerga as interfaces do domínio"
type = "forbidden"
source_modules = ["api.*.application"]
forbidden_modules = ["api.*.infrastructure", "api.*.presentation", "fastapi", "sqlite3", "torch", "ml"]

[[tool.importlinter.contracts]]
name = "assignments: de outra funcionalidade, só o domain/ (a presentation/ monta tudo e fica de fora)"
